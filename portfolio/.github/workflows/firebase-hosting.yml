name: Azeredo Design | Validar e publicar no Firebase

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - "firebase.json"
      - ".github/workflows/firebase-hosting.yml"
  pull_request:
    branches: [main]
    paths:
      - "portfolio/**"
      - "firebase.json"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Verificar arquivos e integridade do site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar conteúdo, código, catálogo e PDF
        run: node portfolio/.automation/validate-site.mjs

  preview:
    name: Publicar visualização do Pull Request
    needs: validar
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pré-visualização Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AZEREDO }}
          projectId: azeredo-design-institucional
          channelId: pr-${{ github.event.number }}
          expires: 7d
          entryPoint: .

  producao:
    name: Publicar site oficial
    needs: validar
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Firebase Hosting — produção
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AZEREDO }}
          projectId: azeredo-design-institucional
          channelId: live
          entryPoint: .
